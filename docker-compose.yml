version: '3.8'

services:
  # Service Next.js Frontend
  nihon-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nihon-app
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=mariadb
      - DB_USER=${DB_USER:-nihon_user}
      - DB_PASSWORD=${DB_PASSWORD:-nihon_password}
      - DB_NAME=${DB_NAME:-nihon_db}
      - DB_PORT=${DB_PORT:-3306}
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - nihon-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - /app/node_modules  # Ne pas synchroniser node_modules

  # Service MariaDB
  mariadb:
    image: mariadb:11.4
    container_name: nihon-mariadb
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-root_password}
      - MARIADB_USER=${DB_USER:-nihon_user}
      - MARIADB_PASSWORD=${DB_PASSWORD:-nihon_password}
      - MARIADB_DATABASE=${DB_NAME:-nihon_db}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - nihon-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      --max-connections=1000
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

networks:
  nihon-network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
